services:
  api:
    build:
      context: ./api
    image: homara-atlas-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      NEON_FUNCTION_ATLAS_BASE_URL: ${NEON_FUNCTION_ATLAS_BASE_URL:?Set the deployed Atlas API URL}
      ATLAS_ALLOWED_HOSTS: ${ATLAS_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-}
        VITE_NEON_REALTIME_URL: ${VITE_NEON_REALTIME_URL:-}
    image: homara-atlas-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
