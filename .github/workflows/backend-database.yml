name: Backend and database contract tests
on:
  push:
    branches: [main, develop]
    paths: ['functions/**', 'database/neon/**', 'data-platform/reference/**', 'scripts/**', 'backend-tests/**', 'package*.json', 'tsconfig.json', 'neon.ts', '.github/workflows/backend-database.yml']
  pull_request:
    paths: ['functions/**', 'database/neon/**', 'data-platform/reference/**', 'scripts/**', 'backend-tests/**', 'package*.json', 'tsconfig.json', 'neon.ts', '.github/workflows/backend-database.yml']
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/atlas
      ATLAS_API_DATABASE_URL: postgresql://atlas_api_login:test-api@localhost:5432/atlas
      ATLAS_WORKER_DATABASE_URL: postgresql://atlas_worker_login:test-worker@localhost:5432/atlas
      ATLAS_LOCAL_TEST_DB: 'true'
      NEON_BRANCH: codex-backend-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:functions
      - run: node scripts/import-locations.mjs --check
      - run: node scripts/migrate.mjs
      - run: node scripts/migrate.mjs
      - run: node scripts/bootstrap-test-db.mjs
      - run: npm run test:backend
      - run: npm audit --audit-level=high
