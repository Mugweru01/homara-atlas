name: Deploy to AWS EC2 (Free Tier)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API Image
      uses: docker/build-push-action@v4
      with:
        context: ./api
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/homara-atlas-api:latest

    - name: Build and push Web Image
      uses: docker/build-push-action@v4
      with:
        context: ./apps/web
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/homara-atlas-web:latest

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/homara-atlas
          git pull origin main
          # Write a .env file for docker-compose to pick up DB secrets
          cat > .env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          EOF
          # Pull latest images
          docker-compose -f docker-compose.prod.yml pull
          # Restart services in detached mode
          docker-compose -f docker-compose.prod.yml up -d
          # Clean up old dangling images to save EBS disk space (30GB limit)
          docker image prune -f
