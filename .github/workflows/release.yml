name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Sign, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: homara-atlas-sbom.spdx.json
          
      - name: Build Web App
        run: |
          cd apps/web
          npm install -g bun
          bun install
          bun run build
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            homara-atlas-sbom.spdx.json
          generate_release_notes: true
