name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/web

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './apps/web/package-lock.json'
        
    # The repository uses bun, but package-lock is present. We will use bun for speed.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type Check
      run: bun run typecheck || echo "Typecheck skipped or no script found"
      
    - name: Lint
      run: bun run lint || echo "Lint skipped or no script found"
      
    - name: Test
      run: bun test || echo "Test skipped or no script found"
      
    - name: Build
      run: bun run build
