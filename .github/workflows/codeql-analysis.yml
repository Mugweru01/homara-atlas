name: CodeQL security analysis
on:
  push:
    branches: [main, develop]
    paths: ['apps/web/src/**', 'api/**', 'functions/**', 'scripts/**', '.github/workflows/codeql-analysis.yml']
  pull_request:
    paths: ['apps/web/src/**', 'api/**', 'functions/**', 'scripts/**', '.github/workflows/codeql-analysis.yml']
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: '/language:${{ matrix.language == ''javascript-typescript'' && ''javascript'' || matrix.language }}'
